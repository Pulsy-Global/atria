services:
  nats:
    image: nats:2.12.3
    container_name: ${COMPOSE_PROJECT_NAME:-atria}-nats
    restart: unless-stopped
    command:
      - "-c"
      - "/etc/nats/nats-server.cfg"
      - "--user"
      - "${NATS_USER:-natsadmin}"
      - "--pass"
      - "${NATS_PASS:-natsadmin}"
      - "--http_port"
      - "8222"
    ports:
      - target: 4222
        published: 4222
      - target: 8222
        published: 8222
    healthcheck:
      test: ["CMD", "/nats-server", "-t", "-c", "/etc/nats/nats-server.cfg"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atria-network
    volumes:
      - ${ATRIA_ROOT:-../../..}/config/nats/:/etc/nats/
      - ${ATRIA_ROOT:-../../..}/data/nats:/data

  postgresql:
    image: postgres:15.15
    container_name: ${COMPOSE_PROJECT_NAME:-atria}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-Atria}
      POSTGRES_USER: ${POSTGRES_USER:-Atria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Atria}
      PGDATA: ${PGDATA:-/data/postgres}
    ports:
      - target: 5432
        published: 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atria-network
    volumes:
      - ${ATRIA_ROOT:-../../..}/data/postgres:/data/postgres

networks:
  atria-network:
    driver: bridge
