<fuse-loading-bar></fuse-loading-bar>

<div
    class="layout-root flex w-full flex-auto"
    [class.panel-active]="sidePanelService.isOpen() && !isScreenSmall">
    @if (isScreenSmall && hasNavigationItems) {
        <fuse-vertical-navigation
            class="bg-default dark"
            [mode]="'over'"
            [name]="'mainNavigation'"
            [navigation]="navigation.items"
            [opened]="false">
            <ng-container fuseVerticalNavigationContentHeader>
                <div class="flex h-20 items-center px-8 pt-6">
                    <div class="relative flex items-center">
                        <img
                            class="logo-border w-12"
                            src="images/logo/logo.svg"
                            alt="Logo image" />
                        <img
                            class="logo-border relative -left-4 top-5 ml-1.5 w-5"
                            src="images/logo/pulsy-logo.svg"
                            alt="Pulsy logo" />
                    </div>
                    <div class="-ml-4 mt-3.5 flex flex-col">
                        <div class="flex items-center gap-1.5">
                            <span
                                class="text-default text-xl font-semibold leading-tight">
                                Atria
                            </span>
                            <span
                                class="rounded bg-primary-500 px-1.5 py-0.5 text-[10px] font-bold uppercase leading-none tracking-wider text-on-primary">
                                beta
                            </span>
                        </div>
                        <a
                            href="https://pulsy.app"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="text-secondary ml-2.5 text-sm font-normal italic no-underline transition-colors hover:text-default">
                            Powered by Pulsy
                        </a>
                    </div>
                </div>

                <div class="flex flex-col gap-3 px-6 pt-8">
                    <ng-container #mobileWidgetsContainer></ng-container>
                </div>
            </ng-container>
        </fuse-vertical-navigation>
    }

    <div
        class="layout-content-card bg-default flex w-full min-w-0 flex-auto flex-col items-center shadow-2xl sm:rounded-xl"
        [class.panel-open]="sidePanelService.isOpen() && !isScreenSmall">
        <div
            class="relative z-49 flex h-16 w-full flex-0 items-center px-4 sm:h-20 sm:px-6">
            @if (!isScreenSmall) {
                <div class="flex items-center lg:mr-8">
                    <div class="relative flex items-center">
                        <div class="hidden lg:flex">
                            <img
                                class="logo-border w-12"
                                src="images/logo/logo.svg"
                                alt="Logo image" />
                        </div>
                        <div class="flex lg:hidden">
                            <img
                                class="logo-border w-8"
                                src="images/logo/logo.svg"
                                alt="Logo image" />
                        </div>
                        <img
                            class="logo-border relative -left-4 top-3.5 ml-1.5 w-5 lg:top-5"
                            src="images/logo/pulsy-logo.svg"
                            alt="Pulsy logo" />
                    </div>
                    <div class="-ml-4 mt-3.5 hidden flex-col lg:flex">
                        <div class="flex items-center gap-1.5">
                            <span
                                class="text-default text-xl font-semibold leading-tight">
                                Atria
                            </span>
                            <span
                                class="rounded bg-primary-500 px-1.5 py-0.5 text-[10px] font-bold uppercase leading-none tracking-wider text-on-primary">
                                beta
                            </span>
                        </div>
                        <a
                            href="https://pulsy.app"
                            target="_blank"
                            rel="noopener noreferrer"
                            class="text-secondary ml-2.5 text-sm font-normal italic no-underline transition-colors hover:text-default">
                            Powered by Pulsy
                        </a>
                    </div>
                </div>
                <fuse-horizontal-navigation
                    class="mr-2"
                    [name]="'mainNavigation'"
                    [navigation]="
                        navigation.items
                    "></fuse-horizontal-navigation>
            }
            @if (isScreenSmall) {
                @if (hasNavigationItems) {
                    <button
                        class="mr-2"
                        mat-icon-button
                        aria-label="Open navigation"
                        (click)="toggleNavigation('mainNavigation')">
                        <mat-icon
                            [svgIcon]="'heroicons_outline:bars-3'"></mat-icon>
                    </button>
                } @else {
                    <div
                        class="mr-2 flex h-10 w-10 items-center justify-center">
                        <img
                            class="logo-border w-8"
                            src="images/logo/logo.svg"
                            alt="Atria" />
                    </div>
                }
            }
            <div class="ml-auto flex items-center gap-2 pl-2">
                <ng-container #headerWidgetsContainer></ng-container>
            </div>
        </div>

        <div class="bg-default flex w-full flex-auto flex-col">
            @if (true) {
                <router-outlet></router-outlet>
            }
        </div>
    </div>

    <!-- Side panel slot -->
    <div
        class="layout-side-panel"
        [class.layout-side-panel--open]="sidePanelService.isOpen()"
        [class.layout-side-panel--mobile]="isScreenSmall"
        [style.--side-panel-width.px]="sidePanelService.config()?.width ?? 380">
        <div class="layout-side-panel__inner">
            <ng-container #sidePanelContainer></ng-container>
        </div>
    </div>
</div>

<div
    data-notification-container
    class="pointer-events-none fixed right-5 top-5 z-[9999] flex max-w-sm flex-col gap-3"></div>

<div class="hidden">
    <fuse-alert
        data-success-template
        [type]="'success'"
        [appearance]="'border'"
        [dismissible]="true"
        [showIcon]="true"
        class="pointer-events-auto translate-x-full transform opacity-100 transition-transform duration-300 ease-in-out">
        <span fuseAlertTitle>Success</span>
        Success message
    </fuse-alert>

    <fuse-alert
        data-error-template
        [type]="'error'"
        [appearance]="'border'"
        [dismissible]="true"
        [showIcon]="true"
        class="pointer-events-auto translate-x-full transform opacity-100 transition-transform duration-300 ease-in-out">
        <span fuseAlertTitle>Error</span>
        Error message
    </fuse-alert>

    <fuse-alert
        data-warning-template
        [type]="'warning'"
        [appearance]="'border'"
        [dismissible]="true"
        [showIcon]="true"
        class="pointer-events-auto translate-x-full transform opacity-100 transition-transform duration-300 ease-in-out">
        <span fuseAlertTitle>Warning</span>
        Warning message
    </fuse-alert>

    <fuse-alert
        data-info-template
        [type]="'info'"
        [appearance]="'border'"
        [dismissible]="true"
        [showIcon]="true"
        class="pointer-events-auto translate-x-full transform opacity-100 transition-transform duration-300 ease-in-out">
        <span fuseAlertTitle>Info</span>
        Info message
    </fuse-alert>
</div>
