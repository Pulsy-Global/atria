global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: atria-observability
    static_configs:
      - targets:
          - otel-collector:9464

  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8888

  - job_name: victoria-metrics
    static_configs:
      - targets:
          - victoria-metrics:8428
