extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  filter/drop_business_metrics:
    error_mode: propagate
    metric_conditions:
      - 'scope.name == "Atria.BusinessMetrics"'
  filter/business_metrics_only:
    error_mode: propagate
    metric_conditions:
      - 'scope.name != "Atria.BusinessMetrics"'
  batch:
    send_batch_size: 2048
    timeout: 5s

exporters:
  prometheus/observability:
    endpoint: 0.0.0.0:9464
    resource_to_telemetry_conversion:
      enabled: true
  prometheusremotewrite/business:
    endpoint: http://victoria-metrics:8428/api/v1/write
    resource_to_telemetry_conversion:
      enabled: true
    remote_write_queue:
      enabled: true
      queue_size: 10000
      num_consumers: 4
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 30s
      max_elapsed_time: 5m

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  extensions:
    - health_check
  pipelines:
    metrics/observability:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - filter/drop_business_metrics
        - batch
      exporters:
        - prometheus/observability
    metrics/business:
      receivers:
        - otlp
      processors:
        - memory_limiter
        - filter/business_metrics_only
        - batch
      exporters:
        - prometheusremotewrite/business
